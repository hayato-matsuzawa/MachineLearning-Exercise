name: Kaggriculture V7 Reissue

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kaggriculture-v7-reissue.yml'
      - 'kaggriculture-reissue-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

env:
  DRIVE_FILE_ID: 1kqhp1YHqxgLfZjhxiq40oDQyU5tRghYP

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download verified v7 source from Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/src
          urls=(
            "https://drive.usercontent.google.com/download?id=${DRIVE_FILE_ID}&export=download&confirm=t"
            "https://drive.google.com/uc?export=download&id=${DRIVE_FILE_ID}&confirm=t"
          )
          ok=0
          for url in "${urls[@]}"; do
            rm -f out/src/main.py
            if curl -L --fail --retry 2 --connect-timeout 20 --max-time 90 "$url" -o out/src/main.py; then
              if grep -q '^# Kaggriculture v7 - safe day-6 replanning' out/src/main.py && [ "$(wc -c < out/src/main.py)" -eq 61506 ]; then
                ok=1
                break
              fi
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo 'Drive source could not be downloaded as the expected 61,506-byte v7 main.py.' >&2
            if [ -f out/src/main.py ]; then
              wc -c out/src/main.py >&2 || true
              head -c 300 out/src/main.py >&2 || true
            fi
            exit 1
          fi
      - name: Compile and package
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile out/src/main.py
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, tarfile
          src = Path('out/src/main.py')
          archive = Path('out/kaggriculture_v7_safe_replan_reissued.tar.gz')
          with tarfile.open(archive, 'w:gz', compresslevel=9) as tf:
              tf.add(src, arcname='main.py')
          with tarfile.open(archive, 'r:gz') as tf:
              assert tf.getnames() == ['main.py']
          report = {
              'source_size': src.stat().st_size,
              'archive_size': archive.stat().st_size,
              'source_sha256': hashlib.sha256(src.read_bytes()).hexdigest(),
              'archive_sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              'archive_members': ['main.py'],
              'policy': 'Kaggriculture v7 safe day-6 replanning',
              'note': 'This is a faithful reissue of the verified v7 source, not the previously claimed unverified 85% model.'
          }
          Path('out/verification.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY
      - name: Upload reissue bundle
        uses: actions/upload-artifact@v4
        with:
          name: kaggriculture-v7-safe-replan-reissued
          path: |
            out/kaggriculture_v7_safe_replan_reissued.tar.gz
            out/verification.json
          if-no-files-found: error
          retention-days: 7
